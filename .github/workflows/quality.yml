name: Theme quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/themeTest.php && php tests/individualizeScholarTest.php
      - name: Check JavaScript syntax
        run: |
          node --check js/manuscriptScholar.js && node --check js/manuscriptScholarAdmin.js
          node --check individualizeScholar/js/individualizeScholar.js && node --check individualizeScholar/js/individualizeScholarAdmin.js
      - name: Shared helpers of Individualize Scholar are up to date
        run: scripts/sync-individualize-scholar.sh --check
      - name: Check version numbers agree
        run: scripts/check-version.sh && scripts/check-version-individualize-scholar.sh
      - name: Check locale files
        run: scripts/check-locales.sh
      - name: Package
        run: |
          version=$(scripts/check-version.sh)
          scripts/package-theme.sh "$RUNNER_TEMP/manuscriptScholar-v${version}.tar.gz"
          test "$(tar -tzf "$RUNNER_TEMP/manuscriptScholar-v${version}.tar.gz" | sed -n '1p')" = "manuscriptScholar/"
          tar -tzf "$RUNNER_TEMP/manuscriptScholar-v${version}.tar.gz" | grep -q '^manuscriptScholar/js/manuscriptScholar.js$'
          ! tar -tzf "$RUNNER_TEMP/manuscriptScholar-v${version}.tar.gz" | grep -q '^manuscriptScholar/individualizeScholar/'
      - name: Package Individualize Scholar
        run: |
          version=$(scripts/check-version-individualize-scholar.sh)
          scripts/package-individualize-scholar.sh "$RUNNER_TEMP/individualizeScholar-v${version}.tar.gz"
          tar -tzf "$RUNNER_TEMP/individualizeScholar-v${version}.tar.gz" | grep -q '^individualizeScholar/IndividualizeScholarThemePlugin.inc.php$'
          tar -tzf "$RUNNER_TEMP/individualizeScholar-v${version}.tar.gz" | grep -q '^individualizeScholar/flags/id.svg$'
